<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><style>text{font-family:Arial,sans-serif;fill:#102a20}.t{font-size:24px;font-weight:bold}.l{font-size:15px;font-weight:bold}.s{font-size:12px}.b{fill:#eef7f2;stroke:#2b433c;stroke-width:2}.x{fill:#d5f6e4;stroke:#00895e;stroke-width:3}.d{fill:#fff4d6;stroke:#8a5b00;stroke-width:2}.a{stroke:#334155;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><text x="40" y="40" class="t">ShopLedger architecture — Ticket 3 highlighted</text><g class="b"><rect x="40" y="90" width="210" height="110"/><rect x="330" y="90" width="210" height="110"/><rect x="630" y="65" width="220" height="155"/><rect x="670" y="350" width="190" height="150"/><rect x="930" y="350" width="190" height="150"/></g><rect x="930" y="90" width="220" height="110" class="d"/><rect x="70" y="350" width="220" height="150" class="x"/><rect x="370" y="350" width="220" height="150" class="x"/><g class="l"><text x="60" y="125">Browser UI</text><text x="350" y="125">Express server</text><text x="650" y="95">Routes</text><text x="950" y="125">Persistent data</text><text x="90" y="385">Inventory ★ ticket</text><text x="390" y="385">Orders ★ ticket</text><text x="690" y="385">Business modules</text><text x="950" y="385">Storage module</text></g><g class="s"><text x="60" y="150">public/index.html · public/js/app.js</text><text x="350" y="150">server.js · config.js</text><text x="650" y="120">products.js · orders.js</text><text x="650" y="145">customers.js · reports.js</text><text x="950" y="150">data/db.json</text><text x="90" y="410">lib/inventory.js</text><text x="90" y="435">2 check · 3 reserve · 6 restore</text><text x="390" y="410">lib/orders.js</text><text x="390" y="435">4 add order · 5 cancel</text><text x="690" y="410">pricing · tax · coupons · ledger</text><text x="690" y="435">invoice · dates · reports</text><text x="950" y="410">lib/store.js</text><text x="950" y="435">7 write order/audit</text><text x="40" y="650">Order: UI → route → stock check → pricing/ledger → reserve → order → write.</text><text x="40" y="680">Cancel: route → orders.cancel → stock restore → optional ledger reversal → write.</text><text x="40" y="730">Green boxes are Ticket 3’s allowed modules.</text></g><path d="M250 145H330M540 145H630M850 145H930M740 220V300H180V350M740 220V300H480V350M480 500V570H1025V500" class="a" fill="none"/></svg>
